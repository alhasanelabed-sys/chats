name: Majlis Android and backend

on:
  push:
    branches: [app/majlis-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majlis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Install JSON runtime for JVM contract tests
        run: |
          mkdir -p tools
          curl --fail --location --retry 3 --retry-delay 2 \
            --output tools/json-20240303.jar \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
      - name: Verify Android recording and data contracts
        run: |
          bash scripts/test-recording-clock.sh
          bash scripts/test-android-data.sh
          bash scripts/test-meeting-evaluation.sh
      - name: Build and verify debug APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: majlis-debug-apk
          path: dist/majlis-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: majlis-debug-apk
          path: dist
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install AAC inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install and exercise Arabic app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/android-smoke.py dist/majlis-debug.apk --output dist/android-smoke
      - name: Save UI, native AAC, PDF evidence and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majlis-android-smoke-evidence
          path: dist/android-smoke
          if-no-files-found: warn
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Verify backend contracts without live credentials
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app tests

  publish:
    needs: [android, android-smoke, backend]
    if: github.ref == 'refs/heads/app/majlis-android' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: majlis-debug-apk
          path: dist
      - name: Save verified installable APK on the app branch
        run: |
          mkdir -p downloads
          cp dist/majlis-debug.apk downloads/majlis-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads/majlis-debug.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified Majlis debug APK [skip ci]'
          git push origin 'HEAD:refs/heads/app/majlis-android'
